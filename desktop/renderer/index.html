<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';">
  <title>Gecho</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="page">
    <header class="header">
      <div class="brand"><span class="mark">G</span><div><strong>Gecho</strong><small>桌面助手</small></div></div>
      <span id="service-badge" class="badge pending">正在启动</span>
    </header>

    <section class="hero">
      <div>
        <p class="eyebrow">浏览器连接中心</p>
        <h1>让 Gecho 在你的真实浏览器中工作</h1>
        <p class="lead">桌面助手负责保持本地 Bridge 运行，并连接已登录的 Chrome 或 Edge。当前版本先用于快速验证桌面端能力。</p>
        <div class="actions">
          <button id="onboarding" class="primary">打开浏览器连接引导</button>
          <button id="data-dir" class="secondary">打开数据目录</button>
        </div>
      </div>
      <div class="status-card">
        <div class="status-row"><span>本地 Bridge</span><strong id="service-status">检查中</strong></div>
        <div class="status-row"><span>浏览器插件</span><strong id="extension-status">检查中</strong></div>
        <div class="status-row"><span>浏览器</span><strong id="browser-status">—</strong></div>
        <div class="status-row"><span>Profile</span><strong id="profile-status">—</strong></div>
      </div>
    </section>

    <section class="settings">
      <div>
        <h2>运行设置</h2>
        <p>开启后，登录电脑时自动启动 Gecho。关闭窗口只会隐藏到后台。</p>
      </div>
      <label class="toggle"><input id="auto-start" type="checkbox"><span></span></label>
    </section>

    <footer>
      <span id="version">Gecho Desktop</span>
      <div class="footer-actions"><button id="hide" class="text-button">隐藏窗口</button><button id="quit" class="text-button danger">退出助手</button></div>
    </footer>
  </main>
  <script src="./renderer.js"></script>
</body>
</html>
