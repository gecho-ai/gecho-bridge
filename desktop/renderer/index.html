<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';">
  <title>Gecho 控制面板</title>
  <link rel="icon" type="image/png" href="../assets/icon.png">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div id="toast" class="toast hidden"></div>
  <main class="page">
    <header class="header">
      <div class="brand">
        <img class="brand-logo" src="../assets/icon.png" alt="Gecho">
        <div>
          <strong>Gecho</strong>
          <small data-i18n="appSubtitle">控制面板 · 桌面助手</small>
        </div>
      </div>
      <div class="header-right">
        <span id="service-badge" class="badge pending">正在检查服务</span>
        <button id="lang-toggle-btn" class="header-action-btn" title="切换语言 / Switch Language">EN</button>
        <button id="onboarding-btn" class="header-action-btn" data-i18n="navOnboarding" title="打开连接引导">连接引导</button>
        <button id="data-dir-btn" class="header-action-btn" data-i18n="navDataDir" title="打开本地数据目录">数据目录</button>
        <button id="export-logs-btn" class="header-action-btn" data-i18n="navExportLogs" title="生成并导出诊断报告">导出日志</button>
      </div>
    </header>

    <div id="network-banner" class="network-banner hidden" data-i18n="networkOffline">⚠️ 网络连接已断开，数据采集与服务通信可能会受到影响</div>

    <!-- 定时任务管理核心区域 -->
    <section class="tasks-section">
      <div class="section-header">
        <div>
          <div class="section-title-wrap">
            <h2 class="section-title" data-i18n="tasksTitle">定时抓取任务</h2>
            <span id="task-stats-badge" class="task-count-badge">3 个任务已配置</span>
          </div>
          <p class="section-subtitle" data-i18n="tasksSubtitle">按预设时间周期在真实浏览器环境中自动执行 TikTok 数据采集与同步</p>
        </div>
        <button id="create-task-btn" class="primary btn-create" data-i18n="btnCreateTask">+ 新建任务</button>
      </div>

      <div id="tasks-list" class="tasks-list">
        <!-- 任务卡片由 renderer.js 动态渲染 -->
        <div class="loading-placeholder" data-i18n="loadingTasks">正在加载定时任务配置...</div>
      </div>
    </section>

    <!-- 系统连接状态摘要 -->
    <section class="system-summary">
      <div class="summary-item">
        <span class="summary-label" data-i18n="summaryBridge">本地 Bridge 引擎</span>
        <strong id="service-status">检查中...</strong>
      </div>
      <div class="summary-item">
        <span class="summary-label" data-i18n="summaryExt">浏览器插件通信</span>
        <strong id="extension-status">检查中...</strong>
      </div>
      <div class="summary-item">
        <span class="summary-label" data-i18n="summaryBrowser">当前挂载浏览器</span>
        <strong id="browser-status">—</strong>
      </div>
      <div class="summary-item">
        <span class="summary-label" data-i18n="summaryProfile">浏览器 Profile</span>
        <strong id="profile-status">—</strong>
      </div>
    </section>

    <!-- 运行偏好设置 -->
    <section class="settings">
      <div>
        <h3 data-i18n="healthTitle">环境自检</h3>
        <p data-i18n="healthDescription">检查服务、插件、浏览器及磁盘；不会修改系统设置。</p>
        <label><input id="health-network" type="checkbox"><span data-i18n="healthNetwork">同时访问官网及 TikTok 检查网络</span></label>
        <ul id="health-results" aria-live="polite"></ul>
      </div>
      <button id="health-check-btn" class="header-action-btn" data-i18n="healthRun">开始自检</button>
    </section>
    <section class="settings">
      <div>
        <h3 data-i18n="settingsAutoStart">开机自启动</h3>
        <p data-i18n="settingsAutoStartDesc">开机登录系统时静默拉起 Gecho 桌面端，常驻托盘守护采集任务。</p>
      </div>
      <label class="toggle"><input id="auto-start" type="checkbox"><span></span></label>
    </section>

    <footer>
      <div class="version-wrap">
        <span id="version">Gecho Desktop</span>
        <button id="check-update-btn" class="text-link-button" data-i18n="btnCheckUpdate">检查更新</button>
      </div>
      <div id="update-action-wrap" class="update-action-wrap hidden">
        <span id="update-msg" class="update-msg"></span>
        <div id="update-progress-bar" class="update-progress-bar hidden">
          <div id="update-progress-fill" class="update-progress-fill"></div>
        </div>
        <button id="update-action-btn" class="update-action-btn hidden"></button>
      </div>
      <div class="footer-actions">
        <button id="hide" class="text-button" data-i18n="btnHide">隐藏到托盘</button>
        <button id="quit" class="text-button danger" data-i18n="btnQuit">退出 Gecho</button>
      </div>
    </footer>
  </main>
  <script src="./renderer.js"></script>
</body>
</html>
